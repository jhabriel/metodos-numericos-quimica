name: Pruebas

# Corre las pruebas (tests/run_all_tests.m) y los ejemplos con GNU Octave en cada
# push a main y en cada pull request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  octave:
    name: Octave 9.2
    runs-on: ubuntu-latest
    container: gnuoctave/octave:9.2.0
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Ejecutar pruebas y ejemplos
        run: octave --no-gui --eval "run('tests/run_all_tests.m')"
